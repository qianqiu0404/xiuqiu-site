name: Static Market Radar Gate and Merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: static-market-radar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate-and-merge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/market-radar-') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Restrict changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          RADAR_DATE="${HEAD_REF#automation/market-radar-}"
          if ! [[ "$RADAR_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Static market radar branch must end with YYYY-MM-DD."
            exit 1
          fi
          RADAR_MONTH="${RADAR_DATE%*-*}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/market-radar-files.txt
          test -s /tmp/market-radar-files.txt
          while IFS= read -r file; do
            case "$file" in
              "content/market-radar/$RADAR_DATE.md"|\
              "public/data/market-radar-packs/$RADAR_DATE.json"|\
              src/data/generatedMarketRadars.ts|\
              src/data/generatedMarketRadarAll.ts|\
              src/data/generatedMarketRadarLoader.ts|\
              "src/data/generatedMarketRadarMonths/$RADAR_MONTH.ts"|\
              public/sitemap.xml) ;;
              *) echo "Static market radar PR changed a non-allowlisted or historical file: $file"; exit 1 ;;
            esac
          done < /tmp/market-radar-files.txt
          grep -Fxq "content/market-radar/$RADAR_DATE.md" /tmp/market-radar-files.txt
          grep -Fxq "public/data/market-radar-packs/$RADAR_DATE.json" /tmp/market-radar-files.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:market-radar
      - run: npm run build
      - name: Ensure generated public data is committed
        run: >-
          git diff --exit-code --
          src/data/generatedMarketRadars.ts
          src/data/generatedMarketRadarAll.ts
          src/data/generatedMarketRadarLoader.ts
          src/data/generatedMarketRadarMonths
          public/data/market-radar-packs
          public/sitemap.xml
      - name: Squash merge verified static market radar
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch --auto
