name: Learning Radar Worker

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Worker mode
        type: choice
        options: [dry-run, ingest, daily]
        default: dry-run
        required: true

permissions:
  contents: read

concurrency:
  group: xiuqiu-learning-radar-worker
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || vars.LEARNING_RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      mode: ${{ steps.gate.outputs.mode }}
      authorized: ${{ steps.gate.outputs.authorized }}
      deployment_id: ${{ steps.gate.outputs.deployment_id }}
      controller_run: ${{ steps.gate.outputs.controller_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_MODE: ${{ inputs.mode }}
      RUN_SCHEDULE: ${{ github.event.schedule }}
      LEARNING_RADAR_ENABLED: ${{ vars.LEARNING_RADAR_ENABLED }}
    steps:
      - name: Require deployed SHA marker and controller authorization
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          release_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]

          mode="${REQUESTED_MODE:-ingest}"
          if [ "$RUN_SCHEDULE" = '0 0 * * *' ]; then mode='daily'; fi
          case "$mode" in
            dry-run|ingest|daily) ;;
            *) echo "Unsupported worker mode: $mode" >&2; exit 1 ;;
          esac

          deployments=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments" \
            -f sha="$release_sha" \
            -f environment='learning-radar-production-authorized' \
            -f per_page=100)
          deployment_id=$(jq -r --arg sha "$release_sha" '
            [.[] | select(
              .sha == $sha and
              .description == "release-controller-authorized" and
              .payload.controller == "release-controller.yml" and
              .payload.release_sha == $sha
            )][0].id // empty
          ' <<< "$deployments")
          deployment_state='missing'
          if [ -n "$deployment_id" ]; then
            deployment_state=$(gh api \
              "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --jq '.[0].state // empty')
          fi

          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-controller.yml/runs" \
            -f event='workflow_dispatch' -f status='success' -f per_page=100)
          expected_title="Release controller · release · $release_sha"
          controller_run=$(jq -r --arg sha "$release_sha" --arg title "$expected_title" '
            [.workflow_runs[] | select(
              .conclusion == "success" and
              .head_sha == $sha and
              .display_title == $title
            )][0].id // empty
          ' <<< "$runs")

          authorized=false
          if [ "$LEARNING_RADAR_ENABLED" = 'true' ] \
            && [ "$deployment_state" = 'success' ] \
            && [ -n "$controller_run" ]; then
            authorized=true
          fi
          if [ "$mode" != 'dry-run' ]; then
            test "$LEARNING_RADAR_ENABLED" = 'true'
            test "$deployment_state" = 'success'
            test -n "$controller_run"
            test "$authorized" = 'true'
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "controller_run=$controller_run" >> "$GITHUB_OUTPUT"
          {
            echo '### Learning Radar authorization evidence'
            echo "- Mode: $mode"
            echo "- Live main: $release_sha"
            echo "- Enabled: ${LEARNING_RADAR_ENABLED:-false}"
            echo "- Deployment marker state: $deployment_state"
            echo "- Successful controller run: $([ -n "$controller_run" ] && echo true || echo false)"
            echo "- Authorized: $authorized"
          } >> "$GITHUB_STEP_SUMMARY"

  report_dry_run:
    needs: authorize
    if: needs.authorize.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Confirm dry-run did not request production access
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          AUTHORIZED: ${{ needs.authorize.outputs.authorized }}
        run: echo "Dry-run evaluated main $RELEASE_SHA; production authorization currently $AUTHORIZED. No environment or secret was requested."

  run:
    needs: authorize
    if: needs.authorize.result == 'success' && needs.authorize.outputs.mode != 'dry-run' && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout the authorized deployed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Run Learning Radar
        env:
          REQUESTED_MODE: ${{ needs.authorize.outputs.mode }}
          LEARNING_RADAR_DATABASE_URL: ${{ secrets.LEARNING_RADAR_DATABASE_URL || secrets.MARKET_RADAR_DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: |
          set -euo pipefail
          test -n "$LEARNING_RADAR_DATABASE_URL"
          test -n "$DEEPSEEK_API_KEY"
          if [ "$REQUESTED_MODE" = 'daily' ]; then npm run learning-radar:worker -- --digest=daily; exit 0; fi
          npm run learning-radar:worker
